<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Infographie PACA</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #EFF7E0;
    color: #233F53;
}

/* NAVBAR */
.navbar {
    background: #233F53;
    padding: 15px;
    text-align: center;
}
.navbar a {
    color: #F7DC83;
    margin: 0 20px;
    text-decoration: none;
    font-weight: bold;
}

/* TITRE */
h1 {
    text-align: center;
    margin-top: 20px;
}

/* SECTIONS */
.section {
    display: flex;
    justify-content: space-around;
    align-items: center;
    margin: 60px 10%;
}
.section.reverse {
    flex-direction: row-reverse;
}

/* TEXTE */
.text-box {
    width: 40%;
    background: #F7DC83;
    padding: 20px;
    border-radius: 15px;
    position: relative;
}

/* ICONE SVG CORRIGÉE */
.icon {
    position: absolute;
    top: -20px;
    right: -20px;
    width: 60px;
    filter: brightness(0) saturate(100%) invert(78%) sepia(37%) saturate(559%) hue-rotate(358deg);
}

/* GRAPHIQUE */
.chart {
    width: 40%;
}

/* FOOTER */
.source {
    text-align: center;
    margin: 30px;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="navbar">
    <a href="index.html">Accueil</a>
    <a href="map.html">Carte</a>
    <a href="infographie.html">Infographie</a>
</div>

<h1>Analyse des observations d’oiseaux en PACA</h1>

<!-- SECTION 1 -->
<div class="section">

    <div class="text-box">
        <img src="data/icones/mouette.svg" class="icon">

        <b>Observateurs et population</b>
        <p>À compléter : relation entre densité de population et nombre d’observateurs.</p>
    </div>

    <canvas id="chart1" class="chart"></canvas>

</div>

<!-- SECTION 2 -->
<div class="section reverse">

    <div class="text-box">
        <img src="data/icones/mouette.svg" class="icon">

        <b>Richesse spécifique</b>
        <p>À compléter : différences écologiques entre départements.</p>
    </div>

    <canvas id="chart2" class="chart"></canvas>

</div>

<div class="source">
Sources : Data.gouv, GBIF – traitements R
</div>

<script>

// ==============================
// PARSER CSV ROBUSTE
// ==============================

function parseCSV(text) {
    const rows = text.trim().split("\n").slice(1);
    return rows.map(r => {
        const c = r.split(",");
        return {
            dep: c[0],
            observateurs: Number(c[2]),   // ⚠️ colonne observateurs_uniques
            richesse: Number(c[3])
        };
    });
}

function parsePop(text){
    const rows = text.trim().split("\n").slice(1);
    return rows.map(r=>{
        const c = r.split(",");
        return {
            dep: c[0],
            population: Number(c[1])
        };
    });
}

// ==============================
// CHARGEMENT
// ==============================

Promise.all([
    fetch("data/indicateurs_departements.csv").then(r=>r.text()),
    fetch("data/data_pop_paca.csv").then(r=>r.text())
]).then(([indCSV, popCSV]) => {

    let ind = parseCSV(indCSV);
    let pop = parsePop(popCSV);

    let merged = ind.map(d=>{
        let p = pop.find(x=>x.dep === d.dep);
        return {
            dep: d.dep,
            observateurs: d.observateurs,
            richesse: d.richesse,
            population: p ? p.population : 0
        };
    });

    // ==============================
    // SCATTERPLOT (CLÉ)
    // ==============================

    new Chart(document.getElementById("chart1"), {
        type: "scatter",
        data: {
            datasets: [{
                label: "Départements",
                data: merged.map(d => ({
                    x: d.population,
                    y: d.observateurs
                })),
                backgroundColor: "#A2D1C1"
            }]
        },
        options: {
            scales: {
                x: { title: { display: true, text: "Population" }},
                y: { title: { display: true, text: "Observateurs uniques" }}
            }
        }
    });

    // ==============================
    // BARPLOT
    // ==============================

    new Chart(document.getElementById("chart2"), {
        type: "bar",
        data: {
            labels: merged.map(d=>d.dep),
            datasets: [{
                data: merged.map(d=>d.richesse),
                backgroundColor: "#FC9E4F"
            }]
        },
        options: {
            plugins: { legend: { display:false } }
        }
    });

});
</script>

</body>
</html>
